[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultraslim"
version = "0.1.0"
description = "Ultracycling-Simulator, schlanke Fassung: FTP, Gewicht, Größe und ein Höhenprofil"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
ultraslim = "ultraslim.app:main"

[tool.setuptools.packages.find]
include = ["ultraslim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
