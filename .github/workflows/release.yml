name: Release

# Jeder Tag v* löst einen Windows-Build aus, der eine UltraSimSlim.exe
# als Release-Asset veröffentlicht. Über "Run workflow" lässt sich der
# Build auch ohne Tag anstoßen — dann landet die EXE als Artefakt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: EXE bauen
        run: pyinstaller ultraslim.spec --noconfirm --clean

      - name: Smoke-Test der EXE
        # Startet die Anwendung kurz und prüft, dass sie antwortet. Ein
        # Build, der nur "erfolgreich" ist, aber nicht startet, hat schon
        # oft genug ein Release gekostet.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\UltraSimSlim.exe `
            -ArgumentList "--no-browser","--port","8765","--data","$env:RUNNER_TEMP\ussdata" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "EXE hat nicht geantwortet" }
            Write-Host "EXE antwortet."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UltraSimSlim-windows
          path: dist/UltraSimSlim.exe

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UltraSimSlim.exe
          generate_release_notes: true
